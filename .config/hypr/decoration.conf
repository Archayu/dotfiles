# ╭─────────────── ✦ ────────────────╮
#│     HYPRLAND SMOOTH ANIMATIONS     │
# ╰─────────────── ✦ ────────────────╯

animations {
    enabled = true
    
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = slow, 0, 0.85, 0.3, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = bounce, 1, 1.6, 0.1, 0.85
    bezier = sligshot, 1, -1, 0.15, 1.25
    bezier = nice, 0, 6.9, 0.5, -4.20
    
    animation = windowsIn, 1, 5, winIn, popin
    animation = windowsOut, 1, 4, winOut, popin 80%
    animation = windowsMove, 1, 4, wind, slide
    animation = windows, 1, 5, wind, slide
    
    animation = fadeIn, 1, 5, slow
    animation = fadeOut, 1, 5, slow
    animation = fadeSwitch, 1, 5, slow
    animation = fadeShadow, 1, 5, slow
    animation = fadeDim, 1, 5, slow
    animation = fade, 1, 5, slow
    
    animation = border, 1, 10, linear
    animation = borderangle, 1, 100, linear, loop
    
    animation = workspaces, 1, 5, wind, slide
    animation = workspacesIn, 1, 5, wind, slidevert
    animation = workspacesOut, 1, 5, wind, slidevert
    
    animation = layers, 1, 5, slow, popin
    animation = layersIn, 1, 5, slow, slide
    animation = layersOut, 1, 5, slow, slide
    animation = fadeLayersIn, 1, 5, slow
    animation = fadeLayersOut, 1, 5, slow
    
    animation = specialWorkspace, 1, 5, wind, slidevert
}

# ╭─────────────── ✦ ────────────────╮
#│       DECORATION SETTINGS          │
# ╰─────────────── ✦ ────────────────╯

decoration {
    rounding = 10
    
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a1aee)
        offset = 0 2
        scale = 1.0
    }
    
    dim_inactive = true
    dim_strength = 0.05
    dim_special = 0.3
    
    blur {
        enabled = true
        size = 2
        passes = 2
        ignore_opacity = false
        new_optimizations = true
        xray = false
        contrast = 1.0
        brightness = 1.0
        vibrancy = 1.0
        vibrancy_darkness = 0.0
        noise = 0.01
        special = true
        popups = true
        popups_ignorealpha = 0.6
    }
}

# ╭─────────────── ✦ ────────────────╮
#│        GENERAL SETTINGS            │
# ╰─────────────── ✦ ────────────────╯

general {
    gaps_in = 1
    gaps_out = 10
    gaps_workspaces = 50
    
    border_size = 1
    
    col.active_border = rgba(8aadf4ff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(585b70ff)
    
    layout = dwindle
    
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    
    allow_tearing = true
}

# ╭─────────────── ✦ ────────────────╮
#│         MISC SETTINGS              │
# ╰─────────────── ✦ ────────────────╯

misc {
    disable_hyprland_logo = false
    disable_splash_rendering = false
    force_default_wallpaper = -1
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
    focus_on_activate = true
}


# ╭─────────────── ✦ ────────────────╮
#│        MASTER LAYOUT               │
# ╰─────────────── ✦ ────────────────╯

master {
    new_status = master
}

