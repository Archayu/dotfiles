# ╭─────────────── ✦ ────────────────╮
#│            KEYBINDINGS             │
# ╰─────────────── ✦ ────────────────╯

#*  Variables 
$mainMod = SUPER       # Super / Meta / Windows key
$TERMINAL = kitty      # Default terminal
$EDITOR = code         # Default editor
$EXPLORER = nautilus   # File manager
$BROWSER = firefox     # Web browser

# -------------------
# Window Management
# -------------------
bind = $mainMod, Q, killactive
bind = ALT, F4, killactive
bind = $mainMod, DELETE, exit
bind = $mainMod, W, togglefloating
bind = SHIFT, F11, fullscreen
bind = $mainMod SHIFT, F, pin
bind = $mainMod, L, exec, swaylock
bind = ALT_R, CONTROL_R, exec, pkill -SIGUSR1 waybar   # toggle waybar (example)



# -------------------
# Change focus
# -------------------
bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, UP, movefocus, u
bind = $mainMod, DOWN, movefocus, d
bind = ALT, TAB, cyclenext

# -------------------
# Resize active window
# -------------------
bind = $mainMod SHIFT, RIGHT, resizeactive, 30 0
bind = $mainMod SHIFT, LEFT, resizeactive, -30 0
bind = $mainMod SHIFT, UP, resizeactive, 0 -30
bind = $mainMod SHIFT, DOWN, resizeactive, 0 30

# -------------------
# Move active window
# -------------------
bind = $mainMod SHIFT CTRL, LEFT, movewindow, l
bind = $mainMod SHIFT CTRL, RIGHT, movewindow, r
bind = $mainMod SHIFT CTRL, UP, movewindow, u
bind = $mainMod SHIFT CTRL, DOWN, movewindow, d

# -------------------
# Move & Resize with mouse
# -------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizeactive
bind = $mainMod, Z, movewindow
bind = $mainMod, X, resizeactive

# -------------------
# Toggle split
# -------------------
bind = $mainMod, J, togglesplit

# -------------------
# Launcher / Apps
# -------------------
bind = $mainMod, T, exec, $TERMINAL
bind = $mainMod, E, exec, $EXPLORER
bind = $mainMod, C, exec, $EDITOR
bind = $mainMod, B, exec, $BROWSER
bind = CTRL SHIFT, ESCAPE, exec, htop
bind = $mainMod, A, exec, $HOME/.config/rofi/launchers/launcher.sh
bind = $mainMod, V, exec,  quickshell ipc call clipMenu toggle
bind = $mainMod SHIFT, C, exec,  hyprpicker

  

# -------------------
# Audio (using pactl)
# -------------------
bind = , F10, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , F11, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , F12, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%

# -------------------
# Media control (playerctl)
# -------------------
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# -------------------
# Brightness control
# -------------------
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# -------------------
# Screen capture
# -------------------
bind = $mainMod, P, exec, $HOME/.config/rofi/ss/ss.sh 


# -------------------
# Theming & Wallpaper 
# -------------------
bind = $mainMod SHIFT, W, exec, $HOME/.config/rofi/wallpaper/wall.sh
bind = $mainMod SHIFT, RIGHT, exec, $HOME/.config/rofi/wallpaper/wall.sh -n
bind = $mainMod SHIFT, LEFT, exec, $HOME/.config/rofi/wallpaper/wall.sh -p
bind = $mainMod SHIFT, R, exec, $HOME/.config/rofi/wallpaper/wall.sh -r

# -------------------
# Workspaces
# -------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL, RIGHT, workspace, r+1
bind = $mainMod CTRL, LEFT, workspace, r-1
bind = $mainMod CTRL, DOWN, workspace, empty

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL ALT, RIGHT, movetoworkspace, r+1
bind = $mainMod CTRL ALT, LEFT, movetoworkspace, r-1

# -------------------
# Scratchpad
# -------------------
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod SHIFT, S, movetoworkspace, special
bind = $mainMod ALT, S, movetoworkspacesilent, special





