# NOTES:
# - Mappings used (per Hyprland wiki & community migration guides):
#     noanim          -> no_anim on
#     noinitialfocus  -> no_initial_focus on
#     noblur          -> no_blur on
#     noborder        -> border_size 0
#     idleinhibit     -> idle_inhibit <mode>
#     floating        -> float on
#     pin             -> pin on
#     size 25% 25%    -> size (monitor_w*0.25) (monitor_h*0.25)
#     move 72% 7%     -> move (monitor_w*0.72) (monitor_h*0.07)
