# ╭─────────────── ✦ ────────────────╮
#│           WINDOW RULES             │
# ╰─────────────── ✦ ────────────────╯

# ═══════════════════════════════════
#  SYSTEM & SPECIAL WINDOWS
# ═══════════════════════════════════

# Idle inhibit for fullscreen apps (prevent screen from sleeping)
windowrule = match:fullscreen true, idle_inhibit fullscreen

# Picture-in-Picture
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, size (monitor_w*0.25) (monitor_h*0.25)
windowrule = match:title ^(Picture-in-Picture)$, move (monitor_w*0.72) (monitor_h*0.07)
windowrule = match:title ^(Picture-in-Picture)$, opacity 0.95 0.85

# XWayland Video Bridge (for screen sharing)
windowrule = match:class ^(xwaylandvideobridge)$, opacity 0.0 override
windowrule = match:class ^(xwaylandvideobridge)$, no_anim on
windowrule = match:class ^(xwaylandvideobridge)$, no_initial_focus on
windowrule = match:class ^(xwaylandvideobridge)$, max_size 1 1
windowrule = match:class ^(xwaylandvideobridge)$, no_blur on

# Ignore maximize requests from apps. You'll probably like this.
# (suppress_event takes event names; 'maximize' is valid)
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
# (match empty class/title — these are tricky but preserved as-regex for original intent)
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, no_focus on

# ═════════════════════════════════==
#  OPACITY RULES
# ═════════════════════════════════==

# Terminals (slightly transparent for aesthetics)
windowrule = match:class ^(kitty)$, opacity 0.92 0.85
windowrule = match:class ^(Alacritty)$, opacity 0.92 0.85
windowrule = match:class ^(Ghostty)$, opacity 0.92 0.85
windowrule = match:class ^(foot)$, opacity 0.92 0.85

# Browsers (light transparency for better readability)
windowrule = match:class ^(firefox)$, opacity 0.95 0.88
windowrule = match:class ^(Firefox)$, opacity 0.95 0.88
windowrule = match:class ^(Google-chrome)$, opacity 0.95 0.88
windowrule = match:class ^(Chromium)$, opacity 0.95 0.88
windowrule = match:class ^(Brave-browser)$, opacity 0.95 0.88
windowrule = match:class ^(microsoft-edge)$, opacity 0.95 0.88
windowrule = match:class ^(Opera)$, opacity 0.95 0.88
windowrule = match:class ^(Vivaldi-stable)$, opacity 0.95 0.88

# Code Editors (clear focus, slight transparency)
windowrule = match:class ^(Code)$, opacity 0.94 0.88
windowrule = match:class ^(code)$, opacity 0.94 0.88
windowrule = match:class ^(VSCodium)$, opacity 0.94 0.88
windowrule = match:class ^(Sublime_text)$, opacity 0.94 0.88
windowrule = match:class ^(jetbrains-.*)$, opacity 0.94 0.88
windowrule = match:class ^(neovide)$, opacity 0.94 0.88

# File Managers
windowrule = match:class ^(org.gnome.Nautilus)$, opacity 0.93 0.86
windowrule = match:class ^(nautilus)$, opacity 0.93 0.86
windowrule = match:class ^(thunar)$, opacity 0.93 0.86
windowrule = match:class ^(Thunar)$, opacity 0.93 0.86
windowrule = match:class ^(dolphin)$, opacity 0.93 0.86
windowrule = match:class ^(nemo)$, opacity 0.93 0.86
windowrule = match:class ^(pcmanfm)$, opacity 0.93 0.86

# Discord & Communication
windowrule = match:class ^(discord)$, opacity 0.94 0.86
windowrule = match:class ^(Discord)$, opacity 0.94 0.86
windowrule = match:class ^(vesktop)$, opacity 0.94 0.86
windowrule = match:class ^(Vesktop)$, opacity 0.94 0.86
windowrule = match:class ^(WebCord)$, opacity 0.94 0.86
windowrule = match:class ^(telegram-desktop)$, opacity 0.94 0.86
windowrule = match:class ^(Slack)$, opacity 0.94 0.86

# Media Players (mostly opaque for better viewing)
windowrule = match:class ^(Spotify)$, opacity 0.98 0.92
windowrule = match:class ^(spotify)$, opacity 0.98 0.92
windowrule = match:class ^(mpv)$, opacity 1.0 1.0
windowrule = match:class ^(vlc)$, opacity 1.0 1.0

# Steam & Gaming (opaque for performance)
windowrule = match:class ^(steam)$, opacity 1.0 1.0
windowrule = match:class ^(steam_app_.*)$, opacity 1.0 1.0
windowrule = match:class ^(gamescope)$, opacity 1.0 1.0

# System Tools
windowrule = match:class ^(pavucontrol)$, opacity 0.90 0.82
windowrule = match:class ^(blueman-manager)$, opacity 0.90 0.82
windowrule = match:class ^(nm-connection-editor)$, opacity 0.90 0.82

# ═════════════════════════════════==
#  FLOATING WINDOWS
# ═════════════════════════════════==

windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(yad)$, float on
windowrule = match:title ^(Open File)$, float on
windowrule = match:title ^(Save File)$, float on
windowrule = match:title ^(Volume Control)$, float on

# Center floating windows
windowrule = match:class ^(pavucontrol)$, center on
windowrule = match:class ^(blueman-manager)$, center on
windowrule = match:class ^(nm-connection-editor)$, center on

# ═════════════════════════════════==
#  GAMING OPTIMIZATIONS
# ═════════════════════════════════==

# Enable tearing for better FPS (adaptive sync)
# 'immediate' is the window-level tearing flag
windowrule = match:class ^(steam_app_.*)$, immediate on
windowrule = match:class ^(cs2)$, immediate on
windowrule = match:class ^(dota2)$, immediate on
windowrule = match:class ^(gamescope)$, immediate on

# ═════════════════════════════════==
#  LAYER RULES (Overlays & Bars)
# ═════════════════════════════════==

# Blur effects for layers
# (layerrule uses same new syntax style)
layerrule = match:namespace waybar, blur on
layerrule = match:namespace logout_dialog, blur on
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-notification-window, blur on

# Rofi (unset blur for better performance)
layerrule = match:namespace rofi, blur on
# In earlier configs you used 'ignorezero' — if you meant ignore alpha/zero behavior, convert when needed.
# (If you want the old exact behavior for rofi, we can refine this later.)

# SwayNC notifications
layerrule = match:namespace swaync-control-center, ignore_alpha 0.5
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.5
layerrule = match:namespace swaync-control-center, ignore_alpha 0.5
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.5

# ═════════════════════════════════==
#  WORKSPACE SPECIFIC (OPTIONAL)
# ═════════════════════════════════==

windowrule = match:class ^(firefox)$, workspace 2
windowrule = match:class ^(Code)$, workspace 1
windowrule = match:class ^(vesktop | discord)$, workspace 3
windowrule = match:class ^(Spotify)$, workspace 5

windowrule = match:title ^(matugen-picker)$, float on
windowrule = match:title ^(matugen-picker)$, size 550 220
windowrule = match:title ^(matugen-picker)$, center on
