# ~/.config/matugen/config.toml

[config]
# default settings (optional)


[templates.quickshell]
input_path  = "~/.config/matugen/templates/quickshell.json"
output_path = "~/.config/quickshell/theme/colors.json"
#post_hook = 'pkill quickshell; nohup quickshell > /dev/null 2>&1 & disown'



[templates.discord]
input_path  = "~/.config/matugen/templates/discord.css"
output_path = "~/.config/vesktop/settings/quickCss.css"


[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/kitty.conf"

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'


[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/matugen.rasi"

[templates.folder]
input_path = '~/.config/matugen/templates/papirus.txt'
output_path = '~/.config/matugen/papirus/papirus.txt'
post_hook = '~/.config/matugen/papirus/change-icons.sh'

[templates.wlogout]
input_path = "~/.config/matugen/templates/wlogout.css"
output_path = "~/.config/wlogout/style.css"


[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = 'pkill -f gtk'

[templates.firefox]
input_path = '~/.config/matugen/templates/firefox.css'
output_path = '~/.mozilla/firefox/sbazuxhu.default-release/chrome/colors.css'
post_hook = 'PROFILE_DIR=$(find ~/.mozilla/firefox -maxdepth 1 -type d -name "*.default-release" | head -n 1); (echo "/* AUTO-GENERATED — DO NOT EDIT */"; find "$PROFILE_DIR/chrome/websites" -maxdepth 1 -type f -name "*.css" ! -name "index.css" | sort | while read -r file; do echo "@import url(\"$(basename "$file")\");"; done) > "$PROFILE_DIR/chrome/websites/index.css"'